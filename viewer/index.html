<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuführung Teller – Aufleger Modul 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --granit:#24272E; --electric:#60FFB0; --stone:#D9D8D4; }
  html,body { margin:0; height:100%; overflow:hidden; background:#e9ecee; font-family:Inter,system-ui,sans-serif; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .title { position:fixed; left:24px; top:20px; color:var(--granit); pointer-events:none; }
  .title h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:.01em; }
  .title p { margin:2px 0 0; font-size:13px; opacity:.65; }
  .hint { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); font-size:12px; color:var(--granit);
          background:rgba(255,255,255,.7); padding:6px 12px; border-radius:20px; backdrop-filter:blur(6px); transition:opacity .6s; }
  #loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
            background:#eef0f1; color:var(--granit); font-size:13px; gap:12px; transition:opacity .6s; }
  #bar { width:220px; height:3px; background:var(--stone); border-radius:2px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#3ad18a,var(--electric)); transition:width .2s; }
  .btn { position:fixed; right:20px; top:20px; border:0; background:rgba(255,255,255,.75); color:var(--granit);
         font:600 12px Inter,sans-serif; padding:8px 12px; border-radius:18px; cursor:pointer; backdrop-filter:blur(6px); }
  .btn:hover { background:#fff; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.36.4/build/index.js",
  "n8ao": "https://cdn.jsdelivr.net/npm/n8ao@1.10.1/dist/N8AO.js"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><h1>Zuführung Teller</h1><p>Aufleger Modul 1</p></div>
<button class="btn" id="reset">Ansicht zurücksetzen</button>
<button class="btn" id="aoBtn" style="top:62px">Schatten (AO): an</button>
<div class="hint" id="hint">Ziehen zum Drehen · Scrollen zum Zoomen</div>
<div id="loader"><div id="bar"><i></i></div><span id="pct">Lade 3D-Modell …</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { N8AOPass } from 'n8ao';

// ---- Einstellungen (an Blender-Szene gekoppelt) ----
const CFG = {
  captureHeight: 1.6,                    // Höhe der Panorama-Kamera in Blender (m)
  capture: new THREE.Vector3(0.44, 0, -0.10), // Position der Panorama-Kamera (three-Koordinaten)
  room: { x: 14, y: 3.8, z: 10 },       // Raummaße aus Blender (m), Panorama-Kamera mittig
  panoRotation: Math.PI / 2,             // Drehung des Panoramas um die Hochachse (rad)
  exposure: 0.32,
  envIntensity: 1.0,
  target: new THREE.Vector3(0, 0.92, 0),
  startPos: new THREE.Vector3(3.27, 1.52, 2.94),
};

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NoToneMapping;   // Tonemapping passiert in den Anlagen-Materialien (s. u.),
                                               // damit das fertig belichtete Panorama unverändert bleibt
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
camera.position.copy(CFG.startPos);

// Zusätzliches Hauptlicht für Glanzkanten auf Edelstahl (entspricht Key-Light in Blender)
const key = new THREE.DirectionalLight(0xfffaf2, 0.35);
key.position.set(3.2, 3.0, 3.1);
scene.add(key);
scene.add(new THREE.HemisphereLight(0xf2f7ff, 0x8a8f94, 0.3));

const controls = new OrbitControls(camera, canvas);
controls.target.copy(CFG.target);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 1.3;
controls.maxDistance = 4.6;               // Raumwände liegen ~5 m vom Zentrum
controls.maxPolarAngle = THREE.MathUtils.degToRad(84);
controls.minPolarAngle = THREE.MathUtils.degToRad(20);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.update();

const hint = document.getElementById('hint');
controls.addEventListener('start', () => { controls.autoRotate = false; hint.style.opacity = 0; });
document.getElementById('reset').onclick = () => {
  camera.position.copy(CFG.startPos); controls.target.copy(CFG.target); controls.update();
};

// ---- Laden ----
const manager = new THREE.LoadingManager();
const bar = document.querySelector('#bar i'), pct = document.getElementById('pct');
manager.onProgress = (_u, l, t) => { bar.style.width = (l / t * 100) + '%'; };
manager.onLoad = () => { const L = document.getElementById('loader'); L.style.opacity = 0; setTimeout(() => L.remove(), 700); };

// Umgebung (Reflexionen/Licht) aus Blender-HDR
new RGBELoader(manager).load('env.hdr', (hdr) => {
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = hdr;
  scene.environmentIntensity = CFG.envIntensity;
  scene.environmentRotation.y = CFG.panoRotation;
});

// Sichtbarer Raum: das Panorama wird auf eine Box mit den echten Raummaßen projiziert.
// Jeder Punkt von Wand/Boden/Decke holt sich die Farbe aus der Richtung, in der ihn die
// Panorama-Kamera gesehen hat -> Wände bleiben gerade, egal von wo man schaut.
new THREE.TextureLoader(manager).load('pano.jpg', (tex) => {
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.wrapS = THREE.RepeatWrapping;
  tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;   // keine Naht am Bildrand
  const R = CFG.room;
  const geo = new THREE.BoxGeometry(R.x, R.y, R.z);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, toneMapped: false,
    uniforms: { map: { value: tex }, capture: { value: new THREE.Vector3(0, CFG.captureHeight, 0) }, rot: { value: CFG.panoRotation } },
    vertexShader: `varying vec3 vWorld;
      void main() { vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform sampler2D map; uniform vec3 capture; uniform float rot; varying vec3 vWorld;
      #include <common>
      void main() {
        vec3 d = normalize(vWorld - capture);
        // Blender-Equirect: Bildmitte = Blickrichtung der Panorama-Kamera (-Z in three), rechts = +X
        float u = fract(0.5 + atan(d.x, -d.z) / (2.0 * PI));
        float v = 1.0 - acos(clamp(d.y, -1.0, 1.0)) / PI;
        gl_FragColor = texture2D(map, vec2(u, v));
        #include <colorspace_fragment>
      }`,
  });
  const roomMesh = new THREE.Mesh(geo, mat);
  roomMesh.position.y = R.y / 2;
  scene.add(roomMesh);
});

// CAD-Exporte haben oft uneinheitliche Dreiecks-Orientierung. three.js würde die Normalen dieser
// Flächen umdrehen (Metall wird dann schwarz). Wir richten die Normale stattdessen immer zur Kamera aus.
const FACING_CHUNK = THREE.ShaderChunk.normal_fragment_begin.replace(
  'float faceDirection = gl_FrontFacing ? 1.0 : - 1.0;',
  'float faceDirection = dot( normalize( vNormal ), normalize( vViewPosition ) ) >= 0.0 ? 1.0 : - 1.0;');
const EXPOSURE = { value: CFG.exposure };
const TONEMAP_PARS = THREE.ShaderChunk.tonemapping_pars_fragment;
function fixFacing(mt) {
  mt.onBeforeCompile = (sh) => {
    sh.uniforms.toneMappingExposure = EXPOSURE;
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <normal_fragment_begin>', FACING_CHUNK)
      .replace('#include <tonemapping_fragment>', 'gl_FragColor.rgb = ACESFilmicToneMapping( gl_FragColor.rgb );')
      .replace('void main() {', TONEMAP_PARS + '\nvoid main() {');
  };
  mt.customProgramCacheKey = () => 'facing-aces';
}

// Anlage
const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/');
const gltfLoader = new GLTFLoader(manager).setDRACOLoader(draco);
gltfLoader.load('Aufleger_Modul_1.glb', (g) => {
  const m = g.scene;
  m.position.set(-CFG.capture.x, 0, -CFG.capture.z);   // Panorama-Mittelpunkt = Ursprung
  const done = new Set();   // Materialien werden von vielen Teilen geteilt – nur einmal anpassen
  m.traverse(o => {
    if (o.isMesh && o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(mt => { if (done.has(mt)) return; done.add(mt); fixFacing(mt); if ('anisotropy' in mt) mt.anisotropy = 0;
        if (mt.metalness > 0.9) { mt.roughness = Math.min(mt.roughness, 0.2); mt.envMapIntensity = 1.0; }  // Edelstahl: klarere, etwas gedämpfte Spiegelungen
        else mt.envMapIntensity = 0.85;  // Anisotropie braucht Tangenten, die im GLB fehlen
        if (mt.transmission > 0) { mt.transparent = true; mt.opacity = 0.25; mt.transmission = 0; mt.roughness = 0.05; mt.depthWrite = false; } });
    }
  });
  scene.add(m);
}, (e) => { if (e.total) pct.textContent = 'Lade 3D-Modell … ' + Math.round(e.loaded / e.total * 100) + ' %'; });

// ---- Eigenschatten (Screen-Space Ambient Occlusion, N8AO) ----
const composer = new EffectComposer(renderer);
const aoPass = new N8AOPass(scene, camera, innerWidth, innerHeight);
Object.assign(aoPass.configuration, {
  aoRadius: 0.45,          // Reichweite in Metern
  distanceFalloff: 1.0,
  intensity: 5,
  color: new THREE.Color(0x10141a),
  aoSamples: 16, denoiseSamples: 8, denoiseRadius: 12,
  halfRes: false,
  gammaCorrection: false,  // übernimmt der OutputPass
  transparencyAware: true, // Glastür wirft keinen falschen Schatten
});
composer.addPass(aoPass);
composer.addPass(new OutputPass());

let aoOn = true;
const aoBtn = document.getElementById('aoBtn');
aoBtn.onclick = () => { aoOn = !aoOn; aoPass.configuration.intensity = aoOn ? 5 : 0; aoBtn.textContent = 'Schatten (AO): ' + (aoOn ? 'an' : 'aus'); };

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

renderer.setAnimationLoop(() => {
  controls.update();
  if (camera.position.y > CFG.room.y - 0.4) { camera.position.y = CFG.room.y - 0.4; controls.update(); }  // nicht durch die Decke
  composer.render();
});
window.__viewer = { scene, camera, controls, renderer, CFG, composer, aoPass };
</script>
</body>
</html>
